name: build

# Cross-compiles phev2mqtt for the Raspberry Pi B+ (ARMv6, 32-bit). Pure Go
# without cgo, so no ARM runner or toolchain is needed; the optional `pcap`
# build tag (libpcap) is left out. A `v*` tag also publishes a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      # -vet=off: the upstream code has a few printf/unreachable-code findings
      # that make `go test` fail in cmd/ and emulator/. Drop it once fixed.
      - name: Test
        run: go test -vet=off ./...

      - name: Build linux/armv6
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm
          GOARM: '6'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/phev2mqtt-linux-armv6 .
          cd dist && sha256sum phev2mqtt-linux-armv6 > phev2mqtt-linux-armv6.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phev2mqtt-linux-armv6
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phev2mqtt-linux-armv6
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
